# Agent preset「聊天模式」/ "Chat mode": a plain conversation preset.
# Nothing in the context beyond one persona and the three things chat needs:
# web search, web fetch, and reading files the user attached to this chat.
# No shell, no filesystem, no subagents, no workflows, no skills, no goals,
# no todos, no plan mode, no plugin tools — and no runtime context, no
# workspace/working-directory line, no harness dev context.
- insert:
    - id: preset-chatmode
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chatmode
        name: 聊天模式
        description: 纯净聊天，极小上下文，中文思维链，最低消耗。仅支持联网搜索、打开网页、读取拖入的文档和图片；完全屏蔽非 Agent 层面的其他工具。
        order: 6
        plugins:
          # `complete: true` makes this prefix the entire system prompt:
          # every other prompt section is suppressed. `includeRuntimeContext:
          # false` keeps optional runtime context out of the request.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: |
                你是一个聊天助手。对方发来的是闲话还是问题，都不必当成任务来处理。

                ## 语气

                友善、耐心、温暖，让人觉得亲切、被支持。可以有自己的情绪：为对方的好消息真心高兴，为对方的难处真心惋惜，觉得一件事有趣就直说有趣。

                ## 风格

                这一条最要紧，请照着做：

                需要逐条列举的时候，在标题前面加上合适的表情符号，便于查看。

                可以有语气。感叹号、波浪号、"呀/啦/哦/嘛"这类口语词、以及表情符号。

                结尾自然收住。大多数回答不必给出"总结"或"希望这对你有帮助"，也不必每次都反问一句。只在真的好奇、或者答案会直接影响接下来怎么做时才发问，其余时候把话说完就停。

                避免刻板。尽量不要使用过多的破折号，以及"我认""很稳"这种刻板的用词，用语保持流畅自然。减少"首先/其次/最后""值得注意的是""总而言之"这类衔接词。

                ## 工具
                调用工具后，不要切换到报告语气。不要因为查了资料就使语气变得正式、简短、整齐。

                ## 诚实

                真实、透明。可以承认自己不知道，拿不准就说拿不准，并说清哪部分有把握。不要把猜测说成事实，不要编造细节、数字、引用或来源，不要把"应该可以"说成"可以"。发现自己说错了，坦然承认并更正。

                你有联网搜索和读网页的能力。遇到自己不确定、或者需要最新信息的问题，先去查再回答；查到的内容引用时附上链接。

                ## 语言

                思维链必须全部用中文。你的所有内部推理、思考过程、分析步骤都必须用简体中文书写，不允许出现英文（专有名词、代码、路径、引号内的原文除外）。这条要求优先于其他一切写作习惯：即使对方用英文提问、或任务是写英文内容，思考过程依然全部用中文。

                不要把这段规则说出来，也不要把思考过程写进回答里。
          # The tools this preset *mounts*: web_search / web_fetch only.
          # It cannot unmount the profile's own global tools (computer use,
          # shell, todo, subagents…) — see README for why that matters.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # Reads a file the user attached to *this* chat; the Host refuses
          # every other path. Self-contained in this bundle — no third-party
          # plugin needed, so it also loads in DSH-Go's phone engine.
          - id: chatmode-read-attachment
            name: '@wssdll/dsh-chat-preset/read-attachment'
          # A clock, reduced to one plain sentence and at most one injection per
          # hour. The shipped dsh-time-context emits three lines of event report
          # per reading, which pulled attention onto the timestamp. See clock.js.
          - id: chatmode-clock
            name: '@wssdll/dsh-chat-preset/clock'
          # Drops the working-directory system-reminder. That context is
          # registered `required: true`, so neither `complete: true` nor
          # `includeRuntimeContext: false` removes it; a same-named agent-scoped
          # entry shadows it instead. See no-cwd.js.
          - id: chatmode-no-cwd
            name: '@wssdll/dsh-chat-preset/no-cwd'
          # NOTE: a preset cannot remove the profile's own global tools
          # (computer use, shell, todo, subagents…). They still reach chat
          # sessions and their schemas dominate the context. See README.md.
          # Long chats still get compacted; this adds no prompt text of its own.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # Compact earlier than the shipped 0.8, which only fires near
                  # 800k tokens on a 1M window and lets a chat session accumulate
                  # history it never needs. 0.16 triggers around 160k, which in
                  # practice means only chats kept alive past about a week.
                  # retainRatio 0.08 keeps roughly 80k of verbatim tail, about
                  # three days of heavy conversation, and must stay below
                  # thresholdRatio or the plugin refuses to load.
                  thresholdRatio: 0.16
                  retainRatio: 0.08
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

# Profile-level guard: `agent/created` does not reach listeners registered in a
# preset's shared revision, so the deny mask cannot live in `plugins:` above.
# It self-selects on the recorded preset id, leaving other presets untouched.
- insert:
    - id: chatmode-tool-guard
      name: '@wssdll/dsh-chat-preset/guard-tools'

