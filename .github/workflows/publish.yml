name: Publish to npm

# Publishes through npm Trusted Publishing (OIDC): GitHub mints a short-lived
# token for this job, so no long-lived npm token or NPM_TOKEN secret exists to
# leak. Requires the trusted publisher configured on npmjs.com with exactly
# these coordinates:
#   owner: wssdll   repository: dsh-chat-preset   workflow: publish.yml
#
# npm CLI >= 11.5.1 is required. Node 22 ships npm 10.9.x, which fails OIDC
# with a misleading "404 Not Found - PUT" instead of an auth error, so the
# version is upgraded explicitly and printed below.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 bundles npm 10.9.x; trusted publishing needs >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Show toolchain versions
        run: |
          node -v
          npm -v

      - name: Publish
        run: npm publish --access public --provenance
